<style>
/* Layout: dark multilingual hero band, then a reading column where each section has its heading on the left (stacked on phones). */
:root{
  --bg:#f4f6f7; --fg:#10222e; --muted:#3e5260; --sub:#5c7180; --line:#d5dee3; --card:#ffffff;
  --kicker:#8a5308; --link:#0b5a80; --link-h:#063b55; --pill:#0e2a3b; --pill-fg:#f3efe6;
  --hero:#0e2a3b; --hero-fg:#f3efe6; --hero-sub:#a9bfcc; --hero-line:#2f566d; --hero-track:#1d4157;
  --amber:#f4b860; --red:#ff8a78; --red-soft:#ffcfc6; --green:#8ad9aa;
  --f-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif; /* Japanese: the visitor's system font */
  --gutter-l:max(20px,env(safe-area-inset-left,0px)); --gutter-r:max(20px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --fg:#e9eef1; --muted:#b4c3cc; --sub:#8fa4b1; --line:#23394a; --card:#122431;
  --kicker:#f4b860; --link:#8cc8e8; --link-h:#bfe2f4; --pill:#e9eef1; --pill-fg:#0b1820; --hero:#0a2130; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --fg:#e9eef1; --muted:#b4c3cc; --sub:#8fa4b1; --line:#23394a; --card:#122431;
  --kicker:#f4b860; --link:#8cc8e8; --link-h:#bfe2f4; --pill:#e9eef1; --pill-fg:#0b1820; --hero:#0a2130; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.6 var(--f-display)}
a{color:var(--link);text-underline-offset:3px}a:hover{color:var(--link-h)}
a:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.mono{font-family:var(--f-mono)}
h1,h2,h3{text-wrap:balance}

/* Hero */
.hero{background:var(--hero);color:var(--hero-fg)}
.hero a{color:var(--amber)}.hero a:hover{color:#ffd59a}
.hero .wrap{padding-block:28px 64px;display:grid;gap:56px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px}
.top .label{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--hero-sub)}
.top nav{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:15px}
.name{margin:0;font-weight:800;font-size:clamp(56px,11.5vw,150px);line-height:.9;letter-spacing:-.035em}
.aka{margin:-8px 0 0;font-family:var(--f-mono);font-size:14px;color:var(--hero-sub);letter-spacing:.02em}
.aka b{color:var(--hero-fg);font-weight:500}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.icon-btn{width:44px;height:44px;min-width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.links a{display:inline-flex;align-items:center;gap:8px}
.links i{width:1.1em;text-align:center}
footer .legal{margin:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:12px;color:var(--hero-sub);border-top:1px solid var(--hero-line);padding-top:20px}
footer .legal a{color:var(--hero-sub)}footer .legal a:hover{color:var(--amber)}
.profiles{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.profiles a{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--hero-line);border-radius:50%;color:var(--hero-fg);font-size:18px;text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.profiles a:hover{background:var(--amber);border-color:var(--amber);color:var(--hero)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0;padding:0;list-style:none}
.tags li{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted);background:var(--card)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tagbox{display:grid;max-width:880px}
.slot{grid-area:1/1;display:grid;gap:12px;align-content:start;visibility:hidden}
.slot.on{visibility:visible}
.tag{margin:0;font-size:clamp(24px,3.3vw,40px);line-height:1.3;transition:opacity .25s}
.tag[lang="ja"]{font-family:var(--f-ja)}
.tag .err{color:var(--red-soft);text-decoration:underline wavy var(--red);text-underline-offset:8px;text-decoration-thickness:2px}
.flag{font-family:var(--f-mono);font-size:14px;color:#ffb4a8}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.ctrl{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center}
.small{font-family:var(--f-mono);font-size:13px;color:var(--hero-sub)}
.dot{width:28px;height:28px;padding:0;border-radius:50%;cursor:pointer;border:2px solid #4f7489;background:transparent}
.dot[aria-pressed="true"]{border-color:var(--amber);background:var(--amber)}
.btn{font:500 13px var(--f-mono);min-height:44px;padding:8px 14px;border-radius:4px;cursor:pointer;border:1.5px solid var(--hero-line);background:transparent;color:var(--hero-fg)}
.btn.dash{border-style:dashed;color:#c9d6de}
.lang{font-size:14px;min-width:48px}
.lang[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--hero)}
.meter{flex:1 1 240px;min-width:0;max-width:360px;display:grid;gap:8px}
.meter .head{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:13px;color:var(--hero-sub)}
.meter .head span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .head b{color:var(--hero-fg);font-weight:500}
.track{height:8px;background:var(--hero-track);border-radius:4px;overflow:hidden}
.bar{height:100%;width:0;background:var(--amber);transition:width .5s ease}
.bar.bad{background:var(--red)}

/* Hero scenes: the tagline and the research animations take turns in one spot.
   All scenes are stacked, so the hero keeps the height of the tallest. */
.stage{display:grid;gap:22px;max-width:980px;margin-top:22px;padding:20px 28px 16px;border:1px solid var(--hero-line);border-radius:14px;background:rgba(255,255,255,.035)}
.stage-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-sub);padding-bottom:14px;border-bottom:1px solid var(--hero-line)}
.stage-h span:first-child{color:var(--amber)}
.scenes{display:grid;max-width:880px}
.scene{grid-area:1/1;display:grid;gap:22px;align-content:start;min-width:0;visibility:hidden}
.scene.on{visibility:visible}
.scene:not(.on) *{visibility:hidden!important}
.scene-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.segs{display:flex;flex-wrap:wrap;gap:2px}
.seg{width:30px;height:28px;padding:0;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center}
.seg::before{content:"";width:100%;height:4px;border-radius:2px;background:var(--hero-line);transition:background .2s}
.seg:hover::before{background:var(--hero-sub)}
.seg[aria-current="true"]::before{background:var(--amber)}
.seg:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.a-src{margin:0;font-family:var(--f-mono);font-size:14px;color:var(--hero-sub)}
.a-lc{display:inline-block;font-size:11px;letter-spacing:.06em;border:1px solid var(--hero-line);border-radius:4px;padding:0 6px;margin-right:10px}
.a-tgt{margin:0;font-size:clamp(24px,3.3vw,40px);line-height:1.45}
.a-tgt[lang="ja"]{font-family:var(--f-ja)}
.a-meta{margin:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-family:var(--f-mono);font-size:13px;color:var(--hero-sub);border-top:1px solid var(--hero-line);padding-top:12px}
.a-meta b{color:var(--amber);font-weight:500;font-variant-numeric:tabular-nums}
@keyframes a-blink{50%{opacity:0}}
.a-typing::after{content:"";display:inline-block;width:2px;height:.9em;background:var(--amber);vertical-align:-.08em;margin-left:3px;animation:a-blink 1s steps(1) infinite}
.a-err,.show-err .a-errw{color:var(--red-soft);text-decoration:underline wavy var(--red);text-underline-offset:8px;text-decoration-thickness:2px}
/* post-editing */
.a-del{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.a-ins{color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}
/* span-level QE */
.a-scan .w{opacity:.5;transition:opacity .2s}
.a-scan .w.read{opacity:1}
.a-sp{border-radius:4px;transition:background .3s,color .3s,box-shadow .3s}
.a-sp.major.on{background:rgba(255,138,120,.16);color:var(--red-soft);box-shadow:inset 0 -3px 0 var(--red)}
.a-sp.minor.on{background:rgba(244,184,96,.14);color:#ffe2b8;box-shadow:inset 0 -3px 0 var(--amber)}
.a-spans{display:grid;gap:8px;max-width:680px}
.a-srow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-family:var(--f-mono);font-size:13px;color:var(--hero-sub);opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.a-srow.in{opacity:1;transform:none}
.a-srow b{color:var(--hero-fg);font-weight:500}
.a-sev{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid;border-radius:4px;padding:1px 6px}
.a-sev.major{color:var(--red);border-color:var(--red)}.a-sev.minor{color:var(--amber);border-color:var(--amber)}
/* word-level QE */
.a-qe{display:flex;flex-wrap:wrap;gap:14px 16px}
.a-cell{display:grid;gap:6px;justify-items:start}
.a-cw{font-size:clamp(24px,3.3vw,40px);line-height:1.2;transition:color .3s}
.a-bar{width:100%;min-width:32px;height:5px;border-radius:3px;background:var(--hero-track);overflow:hidden}
.a-bar i{display:block;height:100%;width:0;transition:width .45s ease}
.a-pv,.a-fix{font-family:var(--f-mono);font-size:12px;opacity:0;transition:opacity .3s}
.a-pv{color:var(--hero-sub)}.a-fix{color:var(--amber)}
.a-cell.ok .a-bar i{background:var(--green)}
.a-cell.warn .a-bar i{background:var(--amber)}.a-cell.warn .a-cw{color:var(--amber)}
.a-cell.bad .a-bar i{background:var(--red)}.a-cell.bad .a-cw{color:var(--red-soft);text-decoration:underline wavy var(--red);text-underline-offset:8px;text-decoration-thickness:2px}
.a-cell.ok .a-pv,.a-cell.warn .a-pv,.a-cell.bad .a-pv,.a-cell.fixed .a-fix{opacity:1}
.a-key{display:flex;flex-wrap:wrap;gap:6px 14px}
.a-key i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-right:6px;vertical-align:middle}
/* counterfactual */
.a-swap{display:inline-block;color:var(--hero-fg);font-weight:500}
.a-swap.flip{color:var(--amber);animation:a-flip .5s ease}
@keyframes a-flip{50%{transform:rotateX(90deg)}}
.show-chg .a-chgw{color:var(--amber)}
.a-expect{margin:-8px 0 0;font-family:var(--f-mono);font-size:13px;color:var(--hero-sub)}
.a-expect span{color:var(--hero-fg)}.a-expect span.diff{color:var(--green)}
.a-scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px}
.a-sc{border:1px solid var(--hero-line);border-radius:8px;padding:10px 14px;display:grid;gap:2px;font-family:var(--f-mono);font-size:12px;color:var(--hero-sub)}
.a-sc b{font-family:var(--f-display);font-size:24px;font-weight:650;color:var(--hero-fg);font-variant-numeric:tabular-nums}
.a-sc b.good{color:var(--green)}.a-sc b.poor{color:var(--red)}
.a-sc em{font-style:normal;color:var(--amber);min-height:1.5em}
/* LLM judge */
.a-judge{border:1px solid var(--hero-line);border-radius:8px;padding:12px 14px;display:grid;gap:7px;font-family:var(--f-mono);font-size:13px;max-width:680px}
.a-judge .hd{font-size:12px;color:var(--hero-sub);display:flex;align-items:center;gap:8px}
.a-judge .hd i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.a-jl{display:flex;flex-wrap:wrap;gap:2px 10px;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.a-jl.in{opacity:1;transform:none}
.a-jl b{font-weight:500}.a-jl.ok b{color:var(--green)}.a-jl.no b{color:var(--red)}
.a-jl span{color:var(--hero-sub)}
.a-vs{display:grid;gap:8px;max-width:560px}
.a-vrow{display:grid;grid-template-columns:120px minmax(0,1fr) 32px;gap:12px;align-items:center;font-family:var(--f-mono);font-size:13px;color:var(--hero-sub)}
.a-vrow .t{height:8px;border-radius:4px;background:var(--hero-track);overflow:hidden}
.a-vrow .t i{display:block;height:100%;width:0;transition:width .7s ease}
.a-vrow b{text-align:right;color:var(--hero-fg);font-weight:500;font-variant-numeric:tabular-nums}
/* attention */
.a-nn{width:100%;max-width:680px;height:auto;display:block;overflow:visible}
.a-nn .pill{fill:var(--hero-track);stroke:var(--hero-line);transition:fill .3s,stroke .3s}
.a-nn .pill.on{fill:#1f4a63;stroke:var(--amber)}
.a-nn .tok{font-family:var(--f-mono);font-size:15px;fill:var(--hero-fg);text-anchor:middle;dominant-baseline:middle}
.a-nn .tok.t{font-family:var(--f-display);font-size:19px;font-weight:600;opacity:0;transition:opacity .3s}
.a-nn .tok.t.on{opacity:1}
.a-nn .rl{font-family:var(--f-mono);font-size:11px;fill:var(--hero-sub)}
.a-nn line{stroke:var(--amber);stroke-linecap:round;transition:opacity .5s}
.a-nn .dot{fill:var(--hero-line);transition:fill .3s}
.a-nn .dot.on{fill:var(--amber)}
/* LLM translation */
.a-prompt{margin:0;font-family:var(--f-mono);font-size:13px;color:var(--hero-sub);border:1px solid var(--hero-line);border-radius:8px;padding:10px 12px;max-width:680px}
.a-prompt b{color:var(--hero-fg);font-weight:500}
.a-llm{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
.a-out .w{opacity:0;transition:opacity .2s}
.a-out .w.in{opacity:1}
.a-out .w.hl{color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}
.a-next{display:grid;gap:8px;border-left:1px solid var(--hero-line);padding-left:16px;min-height:118px;align-content:start}
.a-next p{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--hero-sub)}
.a-cand{display:grid;grid-template-columns:72px minmax(0,1fr) 36px;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px;color:var(--hero-sub)}
.a-cand .t{height:6px;border-radius:3px;background:var(--hero-track);overflow:hidden}
.a-cand .t i{display:block;height:100%;background:var(--hero-sub);transition:width .35s}
.a-cand.pick{color:var(--hero-fg)}.a-cand.pick .t i{background:var(--amber)}
.a-cand b{text-align:right;font-weight:400;font-variant-numeric:tabular-nums}
@media (max-width:620px){
  .stage{padding:16px 16px 12px;margin-top:12px}
  .a-llm{grid-template-columns:minmax(0,1fr)}
  .a-next{border-left:0;padding-left:0;border-top:1px solid var(--hero-line);padding-top:12px;min-height:0}
  .a-vrow{grid-template-columns:100px minmax(0,1fr) 32px}
}

/* Sections */
main .wrap{padding-block:72px 80px;display:grid;gap:88px}
.sec{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;align-items:start;scroll-margin-top:24px}
.sec-h{display:grid;gap:4px}
.sec-h h2{margin:0;font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.sec-h span{font-family:var(--f-mono);font-size:13px;color:var(--sub)}
.intro{display:grid;gap:28px}
.photo{margin:20px 0 0;width:100%;max-width:240px;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo.tint{background:var(--hero)}
.photo.tint img{filter:grayscale(1) contrast(1.05);mix-blend-mode:luminosity;opacity:.9;transition:filter .4s,opacity .4s}
.photo.tint:hover img{filter:none;mix-blend-mode:normal;opacity:1}
.intro .text{display:grid;gap:16px;max-width:64ch}
.intro p{margin:0;color:var(--muted)}
.intro p.lead{font-size:21px;line-height:1.5;color:var(--fg)}
.facts{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 32px;max-width:64ch}
.facts div{display:grid;gap:2px;align-content:start}
.facts dt{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.facts dd{margin:0;font-weight:600}
.r-intro{margin:0 0 28px;max-width:64ch;font-size:18px;color:var(--fg)}
.news{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px}
.news li{display:grid;gap:2px}
.news a{text-decoration-thickness:1px}
.news .when{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--kicker);text-transform:uppercase}
.route{display:grid;grid-template-columns:repeat(var(--stops,3),minmax(0,1fr));gap:28px}
.stop{border-top:3px solid var(--fg);padding-top:18px;display:grid;gap:14px;align-content:start}
.stop-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.code{font-family:var(--f-mono);font-size:13px;font-weight:500;background:var(--pill);color:var(--pill-fg);padding:3px 9px;border-radius:3px}
.stop.current .code{background:var(--amber);color:#0e2a3b}
.stop-h strong{font-size:19px}
.item{display:grid;gap:2px}.item span{font-size:15px;color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.theme{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px;align-content:start}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--kicker)}
.theme h3{margin:0;font-size:22px;font-weight:600;line-height:1.2}
.theme p{margin:0;color:var(--muted);font-size:16px}
.pubs{list-style:none;margin:0;padding:0}
.pub{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;border-top:1px solid var(--line);padding:16px 0}
.pub .y{font-family:var(--f-mono);font-size:14px;color:var(--kicker);flex:0 0 48px;font-variant-numeric:tabular-nums}
.pub .body{flex:1 1 420px;min-width:0;display:grid;gap:2px}
.pub .t{font-weight:600;font-size:17px;line-height:1.4}
.pub .meta{font-size:15px;color:var(--muted)}
.pub .me{color:var(--fg);font-weight:600;text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:2px}
.pub .acts{display:flex;gap:8px}
.chip{font-family:var(--f-mono);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center}
.more{margin:16px 0 0;font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.course{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;align-content:start}
.course .lvl{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;color:var(--sub)}
.course strong{font-size:19px}.course span:last-child{font-size:15px;color:var(--muted)}

/* Footer */
footer{background:var(--hero);color:var(--hero-fg)}
footer a{color:var(--amber)}footer a:hover{color:#ffd59a}
/* Contact: same two-column grid as the sections above (heading left, content right) */
footer .wrap{padding-block:64px 32px;display:grid;gap:48px}
footer .sec{scroll-margin-top:0}
footer .sec-h h2{color:var(--hero-fg)}
footer .sec-h span{color:var(--hero-sub)}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:40px 48px;align-items:start}
.c-block{display:grid;gap:10px;align-content:start}
.c-stack{display:grid;gap:32px;align-content:start}
.c-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-sub);margin:0}
footer .mail{font-size:19px;font-weight:600;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:44px}
footer .mail .btn{display:inline-flex;align-items:center;gap:8px}
footer .addr{color:#c9d6de;font-size:15px;font-style:normal;line-height:1.6}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:28px 32px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.plist a{display:flex;align-items:center;gap:12px;min-height:40px;font-size:15px;color:var(--hero-fg);text-decoration:none;border-bottom:1px solid transparent}
.plist a:hover{color:var(--amber)}
.plist a:hover span{text-decoration:underline;text-underline-offset:3px}
.plist i{width:1.25em;text-align:center;font-size:16px;color:var(--amber)}
footer .note{flex-basis:100%;font-family:var(--f-mono);font-size:12px;color:var(--hero-sub)}

@media (max-width:760px){
  .sec{grid-template-columns:minmax(0,1fr);gap:24px}
  .photo{max-width:180px;margin-top:16px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .route{grid-template-columns:minmax(0,1fr)}
  .stop{border-top:0;border-left:3px solid var(--fg);padding-top:0;padding-left:18px}
  main .wrap{padding-block:56px 64px;gap:64px}
  .hero .wrap{gap:40px}
  .ctrl{gap:20px}
  .contact{grid-template-columns:minmax(0,1fr);gap:32px}
  footer .wrap{padding-block:48px 28px;gap:40px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top">
      <span class="label" id="topLabel"></span>
      <div class="top-r">
        <nav aria-label="Main" id="nav"></nav>
        <button type="button" class="btn icon-btn" id="theme" aria-label="Switch theme"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
      </div>
    </div>
    <div style="display:grid;gap:26px">
      <h1 class="name" id="name"></h1>
      <p class="aka" id="aka" hidden></p>
      <!-- The tagline (scene-qe) and the animations from content.js take turns here -->
      <section class="stage" aria-label="Research animations">
      <div class="stage-h"><span id="sceneName"></span><span id="stageTitle" hidden></span></div>
      <div class="scenes" id="scenes">
        <div class="scene" id="scene-qe">
          <div class="tagbox" id="tagbox" aria-live="polite"></div>
          <div class="row">
            <span class="small" id="exCount"></span>
            <div class="row" style="gap:6px" role="group" aria-label="Choose an example sentence" id="dots"></div>
          </div>
          <div class="ctrl">
            <div class="row" style="gap:8px" role="group" aria-label="Show the tagline in another language" id="langs"></div>
            <div class="meter">
              <div class="head"><span id="meterLabel"></span><b id="score"></b></div>
              <div class="track"><div class="bar" id="bar"></div></div>
              <span class="small" style="font-size:12px">estimated without a reference translation · illustrative</span>
            </div>
          </div>
        </div>
      </div>
      <div class="scene-nav" id="sceneNav">
        <button type="button" class="btn icon-btn" id="auto" aria-label="Pause"><i class="fa-solid fa-pause" aria-hidden="true"></i></button>
        <div class="segs" id="segs" role="group" aria-label="Choose an animation"></div>
      </div>
      </section>
    </div>
  </div>
</header>

<main>
  <!-- Plain-HTML summary for visitors and crawlers without JavaScript -->
  <noscript>
    <div class="wrap" style="padding-block:40px">
      <p><strong>Frédéric (Fred) Blain</strong>, Assistant Professor, Department of Intelligent Systems, Research Center for Cognitive Science &amp; Artificial Intelligence, Tilburg University. Research on machine translation, translation quality estimation and evaluation, and human-centred language technology.</p>
      <p><a href="https://research.tilburguniversity.edu/en/persons/fred-blain/" rel="me">Tilburg University profile</a> · <a href="https://scholar.google.com/citations?hl=en&amp;user=sgBANaQAAAAJ" rel="me">Google Scholar</a> · <a href="https://orcid.org/0000-0003-3017-3722" rel="me">ORCID</a> · <a href="https://aclanthology.org/people/frederic-blain/" rel="me">ACL Anthology</a> · <a href="https://dblp.org/pid/97/11423.html" rel="me">DBLP</a> · <a href="https://www.linkedin.com/in/fredblain" rel="me">LinkedIn</a></p>
    </div>
  </noscript>
  <div class="wrap" id="sections"></div>
</main>

<footer id="contact">
  <div class="wrap" id="foot"></div>
</footer>

<script>
(function () {
  "use strict";
  var C = window.CONTENT;
  if (!C) { document.body.insertAdjacentHTML("afterbegin", "<p style='padding:20px'>content.js could not be loaded. Check that it sits next to index.html and has no syntax error.</p>"); return; }

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var link = function (url, label, cls) { return url ? '<a href="' + esc(url) + '"' + (cls ? ' class="' + cls + '"' : "") + ' target="_blank" rel="noopener">' + esc(label) + "</a>" : ""; };
  var list = function (x) { return Array.isArray(x) ? x : []; };
  /* address: a list of lines, or one string (a "\n" inside it also starts a new line) */
  var addrLines = function () { var a = C.address; return Array.isArray(a) ? a : String(a || "").split("\n"); };
  var sub = C.subtitles || {};
  /* [link text](address) inside text becomes a link. Addresses starting with http(s)
     open in a new tab; relative ones ("notebook-to-cluster/", "assets/x.pdf") stay on the site. */
  var inlineLinks = function (t) {
    return esc(t).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, url) {
      if (/^\s*javascript:/i.test(url)) return label;
      var ext = /^https?:/i.test(url);
      return '<a href="' + url + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + ">" + label + "</a>";
    });
  };

  /* ---------- identity ---------- */
  var nick = C.nickname ? " (" + C.nickname + ")" : "";
  document.title = C.name.replace(/(\S+)\s/, "$1" + nick + " ");   // "Frédéric (Fred) Blain"
  $("name").textContent = C.name;
  if (C.alsoKnownAs) { $("aka").innerHTML = esc(C.alsoKnownAs).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); $("aka").hidden = false; }
  $("topLabel").textContent = C.topLabel || C.institution || "";

  /* ---------- profile links ---------- */
  var orcidUrl = C.orcid ? "https://orcid.org/" + String(C.orcid).replace(/^https?:\/\/orcid\.org\//, "") : "";
  if (!orcidUrl) list(C.links).forEach(function (l) { var m = /orcid\.org\/(\d{4}-\d{4}-\d{4}-\d{3}[\dX])/.exec(l.url || ""); if (m) orcidUrl = "https://orcid.org/" + m[1]; });
  var LINKS = list(C.links).map(function (l) {
    var x = {}; for (var k in l) x[k] = l[k];
    if (orcidUrl && /orcid/i.test(l.label)) { x.url = orcidUrl; x.search = false; }
    return x;
  }).filter(function (l) { return l.url; });
  var SAME_AS = LINKS.filter(function (l) { return !l.search; }).map(function (l) { return l.url; });

  /* $("profiles").innerHTML = LINKS.map(function (l) {
    var label = l.label + (l.search ? " (search)" : "");
    return '<li><a href="' + esc(l.url) + '" target="_blank" rel="' + (l.search ? "noopener" : "me noopener") + '" title="' + esc(label) + '" aria-label="' + esc(label) + '">' +
      '<i class="' + esc(l.icon || "fa-solid fa-link") + '" aria-hidden="true"></i></a></li>';
  }).join(""); */

  /* ---------- canonical URL, link-preview tags ---------- */
  var site = C.siteUrl ? String(C.siteUrl).replace(/\/?$/, "/") : "";
  function headTag(tag, attrs) { var el = document.createElement(tag); for (var a in attrs) el.setAttribute(a, attrs[a]); document.head.appendChild(el); }
  if (site) {
    headTag("link", { rel: "canonical", href: site });
    headTag("meta", { property: "og:url", content: site });
  }
  var big = C.photoLarge || C.photo;
  var photoUrl = big ? (site && !/^https?:/.test(big) ? site + big.replace(/^\.?\//, "") : big) : "";
  if (photoUrl) {
    headTag("meta", { property: "og:image", content: photoUrl });
    headTag("meta", { property: "og:image:alt", content: C.photoAlt || C.name });
    headTag("meta", { name: "twitter:image", content: photoUrl });
  }
  if (C.summary) {
    var md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute("content", C.name + (C.nickname ? " (" + C.nickname + ")" : "") + ". " + C.summary);
  }

  /* ---------- structured data for Google (schema.org ProfilePage + Person + articles) ---------- */
  try {
    var pid = (site || "") + "#person";
    var org = function (n) { return { "@type": "CollegeOrUniversity", name: n }; };
    var person = {
      "@type": "Person", "@id": pid, name: C.name, givenName: C.givenName, familyName: C.familyName,
      alternateName: list(C.alternateNames), jobTitle: C.role, description: C.summary,
      worksFor: org(C.institution), affiliation: [org(C.institution)].concat(list(C.pastEmployers).map(org)),
      alumniOf: list(C.alumniOf).map(org), knowsAbout: list(C.keywords),
      knowsLanguage: ["fr", "en"], sameAs: SAME_AS
    };
    if (site) person.url = site;
    if (photoUrl) person.image = photoUrl;
    /* the email is deliberately NOT given to search engines (anti-spam) */
    if (C.address) person.workLocation = { "@type": "Place", name: C.institution, address: addrLines().join(", ") };
    if (orcidUrl) person.identifier = { "@type": "PropertyValue", propertyID: "ORCID", value: orcidUrl.split("/").pop(), url: orcidUrl };

    var graph = [{ "@type": "ProfilePage", "@id": (site || "") + "#profile", url: site || undefined, name: C.name + " · " + C.institution,
      mainEntity: { "@id": pid }, license: (list((C.legal || {}).licenses).filter(function (x) { return x.rel === "license"; })[0] || {}).url, dateModified: new Date(document.lastModified).toISOString().slice(0, 10), inLanguage: "en" }, person];
    list(C.publications).forEach(function (p) {
      var a = { "@type": "ScholarlyArticle", headline: p.title, name: p.title, datePublished: String(p.year),
        author: String(p.authors || "").split(/,\s*/).filter(function (n) { return n && n !== "et al."; }).map(function (n) {
          return C.highlightAuthor && n === C.highlightAuthor ? { "@id": pid } : { "@type": "Person", name: n };
        }),
        isPartOf: { "@type": "PublicationIssue", name: p.venue } };
      if (p.url) a.url = p.url;
      if (p.doi) a.sameAs = "https://doi.org/" + p.doi;
      graph.push(a);
    });
    headTag("script", { type: "application/ld+json" });
    document.head.lastChild.textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": graph });
  } catch (e) {}

  /* ---------- light / dark toggle ---------- */
  var root = document.documentElement, themeBtn = $("theme");
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
  }
  function paintThemeBtn() {
    var d = isDark();
    themeBtn.innerHTML = '<i class="fa-solid ' + (d ? "fa-sun" : "fa-moon") + '" aria-hidden="true"></i>';
    themeBtn.setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme");
    themeBtn.title = d ? "Light theme" : "Dark theme";
  }
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paintThemeBtn();
  });
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn); } catch (e) {}
  paintThemeBtn();

  /* ---------- sections ---------- */
  function section(id, title, inner, aside) {
    return '<section class="sec" id="' + id + '"><div class="sec-h"><h2>' + esc(title) + "</h2>" +
      (sub[id] ? "<span>" + esc(sub[id]) + "</span>" : "") + (aside || "") + "</div><div>" + inner + "</div></section>";
  }
  var html = [], navItems = [];
  function add(id, label, inner, aside) { if (inner) { html.push(section(id, label, inner, aside)); navItems.push([id, label]); } }
  var photoHtml = C.photo ? '<figure class="photo' + (C.photoStyle === "tint" ? " tint" : "") + '"><picture>' +
    (C.photoWebp ? '<source srcset="' + esc(C.photoWebp) + '" type="image/webp">' : "") +
    '<img src="' + esc(C.photo) + '" alt="' + esc(C.photoAlt || C.name) + '" width="600" height="600" loading="lazy" decoding="async"></picture></figure>' : "";

  /* About: who you are (what you work on goes in Research) */
  var A = C.intro || C.about || {};
  if (A.lead || list(A.paragraphs).length || list(A.facts).length) add("about", "About",
    '<div class="intro"><div class="text">' +
      (A.lead ? '<p class="lead">' + esc(A.lead) + "</p>" : "") +
      list(A.paragraphs).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
    "</div>" +
    (list(A.facts).length ? '<dl class="facts">' + A.facts.map(function (f) { return "<div><dt>" + esc(f.label) + "</dt><dd>" + esc(f.value) + "</dd></div>"; }).join("") + "</dl>" : "") +
    "</div>", photoHtml);

  var R = list(C.research);
  if (R.length || C.researchIntro) add("research", "Research", (C.researchIntro ? '<p class="r-intro">' + esc(C.researchIntro) + "</p>" : "") + '<div class="three">' + R.map(function (r) {
    return '<div class="theme"><span class="kicker">' + esc(r.kicker) + "</span><h3>" + esc(r.title) + "</h3><p>" + esc(r.text) + "</p></div>";
  }).join("") + "</div>" +
  (list(C.keywords).length ? '<h3 class="vh">Keywords</h3><ul class="tags">' + C.keywords.map(function (k) { return "<li>" + esc(k) + "</li>"; }).join("") + "</ul>" : ""));

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var fmtDate = function (d) { var p = String(d).split("-"); return (p[1] ? MONTHS[+p[1] - 1] + " " : "") + p[0]; };
  var news = list(C.news).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  if (news.length) add("news", "News", '<ul class="news">' + news.map(function (n) {
    return '<li><span class="when">' + esc(fmtDate(n.date)) + "</span><span>" + inlineLinks(n.text) + (n.url ? " " + link(n.url, "→") : "") + "</span></li>";
  }).join("") + "</ul>");

  var me = C.highlightAuthor ? esc(C.highlightAuthor) : null;
  var P = list(C.publications).slice().sort(function (a, b) { return (b.year || 0) - (a.year || 0); });
  if (P.length) add("publications", "Publications", '<ol class="pubs">' + P.map(function (p) {
    var authors = esc(p.authors); if (me) authors = authors.split(me).join('<span class="me">' + me + "</span>");
    var acts = link(p.pdf, "PDF", "chip") + link(p.code, "Code", "chip");
    var title = p.url ? link(p.url, p.title) : esc(p.title);
    return '<li class="pub"><span class="y">' + esc(p.year) + '</span><div class="body"><span class="t">' + title + '</span><span class="meta">' + authors + " · <em>" + esc(p.venue) + "</em></span></div>" + (acts ? '<span class="acts">' + acts + "</span>" : "") + "</li>";
  }).join("") + "</ol>" + (C.publicationsMore && C.publicationsMore.url ? '<p class="more">' + link(C.publicationsMore.url, C.publicationsMore.label + " →") + "</p>" : ""));

  var J = list(C.journey);
  if (J.length) add("journey", "Journey", '<div class="route" style="--stops:' + J.length + '">' + J.map(function (s) {
    return '<div class="stop' + (s.current ? " current" : "") + '"><div class="stop-h"><span class="code">' + esc(s.code) + "</span><strong>" + esc(s.place) + '</strong><span class="mono" style="font-size:13px;color:var(--sub)">' + esc(s.period) + "</span></div>" +
      list(s.items).map(function (it) { return '<div class="item"><strong>' + esc(it.title) + "</strong><span>" + esc(it.detail) + "</span></div>"; }).join("") + "</div>";
  }).join("") + "</div>");

  $("sections").innerHTML = html.join("");
  navItems.push(["contact", "Contact"]);
  $("nav").innerHTML = navItems.map(function (n) { return '<a href="#' + n[0] + '">' + esc(n[1]) + "</a>"; }).join("");

  /* ---------- email, protected against harvesting bots ----------
     content.js stores it in two parts ({ user, domain }); the full address is only
     assembled when a visitor clicks "Show email". A plain "a@b.c" string still works. */
  function emailAddress() {
    var e = C.email;
    if (!e) return "";
    if (typeof e === "string") return e;
    return e.user && e.domain ? e.user + "\u0040" + e.domain : "";
  }
  var hasEmail = !!(C.email && (typeof C.email === "string" || (C.email.user && C.email.domain)));

  /* ---------- footer ---------- */
  /* profile links, grouped by their `group` field in content.js (kept in content.js order) */
  var groups = [];
  LINKS.forEach(function (l) {
    var name = l.group || "Profiles", g = groups.filter(function (x) { return x.name === name; })[0];
    if (!g) { g = { name: name, items: [] }; groups.push(g); }
    g.items.push(l);
  });
  var profilesHtml = groups.map(function (g) {
    return '<div class="c-block"><h3 class="c-label">' + esc(g.name) + '</h3><ul class="plist">' + g.items.map(function (l) {
      return '<li><a href="' + esc(l.url) + '" target="_blank" rel="' + (l.search ? "noopener" : "me noopener") + '"><i class="' + esc(l.icon || "fa-solid fa-link") + '" aria-hidden="true"></i><span>' + esc(l.label) + "</span></a></li>";
    }).join("") + "</ul></div>";
  }).join("");

  var left = (hasEmail ? '<div class="c-block"><h3 class="c-label">Email</h3><div class="mail" id="mailbox"><button type="button" class="btn" id="reveal"><i class="fa-solid fa-envelope" aria-hidden="true"></i>Show email</button></div></div>' : "") +
    (C.address ? '<div class="c-block"><h3 class="c-label">' + esc(C.addressLabel || "Office") + '</h3><address class="addr">' + addrLines().map(esc).join("<br>") + "</address></div>" : "");

  $("foot").innerHTML =
    '<section class="sec" aria-labelledby="contact-h"><div class="sec-h"><h2 id="contact-h">Contact</h2>' + (sub.contact ? "<span>" + esc(sub.contact) + "</span>" : "") + "</div>" +
      '<div class="contact">' + (left ? '<div class="c-stack">' + left + "</div>" : "") +
        (profilesHtml ? '<nav class="groups" aria-label="Research profiles and links">' + profilesHtml + "</nav>" : "") +
      "</div></section>" +
    legalLine();
  function legalLine() {
    var L = C.legal || {}, y = new Date().getFullYear(), parts = [];
    if (L.holder) parts.push("© " + (L.since && +L.since < y ? L.since + "–" : "") + y + " " + esc(L.holder));
    list(L.licenses).forEach(function (x) { parts.push(esc(x.what) + ": " + (x.url ? '<a href="' + esc(x.url) + '"' + (x.rel ? ' rel="' + esc(x.rel) + '"' : "") + ">" + esc(x.name) + "</a>" : esc(x.name))); });
    if (C.footerNote) parts.push(esc(C.footerNote));
    return parts.length ? '<p class="legal">' + parts.map(function (p) { return "<span>" + p + "</span>"; }).join("") + "</p>" : "";
  }
  var reveal = $("reveal");
  if (reveal) reveal.addEventListener("click", function () {
    var addr = emailAddress(), box = $("mailbox");
    box.innerHTML = '<a id="mail" href="mailto:' + esc(addr) + '">' + esc(addr) + "</a>" +
      '<button type="button" class="btn icon-btn" id="copy" aria-label="Copy email address" title="Copy"><i class="fa-regular fa-copy" aria-hidden="true"></i></button>';
    var copy = $("copy");
    copy.focus();
    copy.addEventListener("click", function () {
      var icon = function (cls, label) { copy.innerHTML = '<i class="' + cls + '" aria-hidden="true"></i>'; copy.setAttribute("aria-label", label); };
      var done = function () { icon("fa-solid fa-check", "Copied"); setTimeout(function () { icon("fa-regular fa-copy", "Copy email address"); }, 1500); };
      var select = function () { var r = document.createRange(); r.selectNodeContents($("mail")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(addr).then(done, select); } catch (e) { select(); }
    });
  });

  /* ---------- hero: rotating multilingual tagline + research animations ---------- */
  var TG = C.tagline || {}, LANGS = list(TG.languages), EX = list(TG.examples), AN = C.animations || {};

  var shown = null;

  var dots = $("dots"), langs = $("langs");
  dots.innerHTML = EX.map(function (_, k) { return '<button type="button" class="dot" data-k="' + k + '" aria-label="Example ' + (k + 1) + '"></button>'; }).join("");
  dots.addEventListener("click", function (ev) { var b = ev.target.closest(".dot"); if (b) { state.e = +b.dataset.k; state.i = 0; render(); } });
  langs.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    state.i = +b.dataset.i; state.auto = false; render(); setAutoIcon();
  });

    var S = slots(); if (state.i >= S.length) state.i = 0;
    var c = S[state.i], bad = c.q != null && c.q < 0.6;

  /* ---------- the animations ----------

  var src = function (d) { return '<p class="a-src">' + (d.from ? '<span class="a-lc">' + esc(d.from.toUpperCase()) + "</span>" : "") + esc(d.source) + "</p>"; };
  var meta = function (left, right) { return '<p class="a-meta"><span class="who">' + left + '</span><b class="ct">' + (right || "&nbsp;") + "</b></p>"; };
  var arrow = function (d) { return esc((d.from || "").toUpperCase()) + (d.from ? " → " : "") + esc((d.to || "").toUpperCase()); };

  var errSpans = function (t) { return esc(t).replace(/\[\[(.+?)\]\]/g, '<span class="a-errw">$1</span>'); };

  function editOps(a, b) { // word-level edit script (Levenshtein), left to right
    var n = a.length, m = b.length, D = [], i, j, ops = [];
    for (i = 0; i <= n; i++) D[i] = [i];
    for (j = 0; j <= m; j++) D[0][j] = j;
    for (i = 1; i <= n; i++) for (j = 1; j <= m; j++)
      D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    i = n; j = m;
    while (i || j) {

      else { ops.unshift({ from: "", to: b[j - 1] }); j--; }
    }
    return ops;
  }

  async function postEdit(el, d, wait) {

  }

  async function spanQE(el, d, wait) {
    var spans = [], html = "";
    var wrap = function (t) { return t.split(/(\s+)/).map(function (w) { return !w || /^\s+$/.test(w) ? w : '<span class="w">' + esc(w) + "</span>"; }).join(""); };
    String(d.translation || "").split(/(\[\[.+?\]\])/).forEach(function (p) {
      var m = /^\[\[(.+?)\]\]$/.exec(p);
      if (!m) { html += wrap(p); return; }
      var f = m[1].split("|"), sev = String(f[1] || "").trim().toLowerCase() === "minor" ? "minor" : "major";
      spans.push({ text: f[0], sev: sev, note: f.slice(2).join("|").trim() });
      html += '<span class="a-sp ' + sev + '" data-s="' + (spans.length - 1) + '">' + wrap(f[0]) + "</span>";
    });

      '<div class="a-spans">' + spans.map(function (s) {
        return '<div class="a-srow"><span class="a-sev ' + s.sev + '">' + s.sev + "</span><b>" + esc(s.text) + "</b>" + (s.note ? "<span>" + esc(s.note) + "</span>" : "") + "</div>";
      }).join("") + "</div>" + meta(arrow(d) + " · error span detection", "reading…");

  }
  async function wordQE(el, d, wait) {
    var W = list(d.words);
    el.innerHTML = src(d) + '<div class="a-qe" lang="' + esc(d.to) + '">' + W.map(function (w) {
        return '<span class="a-cell"><span class="a-cw">' + esc(w[0]) + '</span><span class="a-bar"><i></i></span><span class="a-pv">' +

  }

  async function counterfactual(el, d, wait) {

  async function attention(el, d, wait) {
    var A = list(d.source), B = list(d.target), Wt = list(d.weights), NS = "http://www.w3.org/2000/svg";
    var step = 140, Wd = Math.max(A.length, B.length) * step;
    var X = function (n, i) { return (Wd - n * step) / 2 + step / 2 + i * step; };

    A.forEach(function (w, i) { var x = X(A.length, i); svg += '<rect class="pill s" x="' + (x - 60) + '" y="26" width="120" height="34" rx="17"/><text class="tok" x="' + x + '" y="44">' + esc(w) + '</text><circle class="dot" cx="' + x + '" cy="74" r="4"/>'; });
    B.forEach(function (w, i) { var x = X(B.length, i); svg += '<rect class="pill t" x="' + (x - 60) + '" y="176" width="120" height="36" rx="18"/><text class="tok t" x="' + x + '" y="195" lang="' + esc(d.to) + '">' + esc(w) + "</text>"; });

    var sp = el.querySelectorAll(".pill.s"), dots = el.querySelectorAll(".dot"), tp = el.querySelectorAll(".pill.t"), tt = el.querySelectorAll(".tok.t"),

    await wait(300); sp.forEach(function (p) { p.classList.remove("on"); });

      await wait(650); tt[k].classList.add("on"); await wait(700); tp[k].classList.remove("on");
    }

    who.textContent = d.note || "attention"; ct.innerHTML = "&nbsp;";
  }

  async function llmTranslate(el, d, wait) {

      '<div class="a-llm"><p class="a-tgt a-out" lang="' + esc(d.to) + '">' +

    function show(cands, pick) {

        return '<div class="a-cand' + (c[0] === pick ? " pick" : "") + '"><span>' + esc(c[0]) + '</span><span class="t"><i style="width:0"></i></span><b>' + Number(c[1]).toFixed(2) + "</b></div>";
      }).join("");

    }

    for (var i = 0; i < T.length; i++) {

  /* ---------- scenes: the tagline and the animations take turns ---------- */
  var BUILD = { postedit: postEdit, spanqe: spanQE, wordqe: wordQE, counterfactual: counterfactual, judge: judge, attention: attention, llm: llmTranslate };
  var box = $("scenes"), SC = [], STOP = {}, gen = 0;

    var items = Array.isArray(d) ? d : [d]; if (!items.length) return;

  if (!SC.length) { $("sceneNav").hidden = true; return; }

  function play(s, instant) {
    var d = s.items[s.n % s.items.length], g = instant ? -1 : ++gen;
    var wait = instant || reduceMotion ? function () { return Promise.resolve(); } :
      function (ms) { return new Promise(function (res, rej) { setTimeout(function () { g === gen ? res() : rej(STOP); }, ms); }); };
    return Promise.resolve().then(function () { return s.fn(s.el, d, wait); })
      .catch(function (e) { if (e !== STOP) console.error(e); throw STOP; });
  }

  var autoBtn = $("auto"), segs = $("segs"), cyc = { k: -1, doneAt: 0, stepAt: 0 };
  function setAutoIcon() {
    if (autoBtn.dataset.on === String(state.auto)) return;   // only swap the icon when the state changes
    autoBtn.dataset.on = String(state.auto);
    autoBtn.innerHTML = '<i class="fa-solid ' + (state.auto ? "fa-pause" : "fa-play") + '" aria-hidden="true"></i>';
    autoBtn.setAttribute("aria-label", state.auto ? "Pause the animations" : "Play the animations");
    autoBtn.title = state.auto ? "Pause" : "Play";
  }
  autoBtn.addEventListener("click", function () { state.auto = !state.auto; setAutoIcon(); });
  segs.innerHTML = SC.map(function (s, k) { return '<button type="button" class="seg" data-k="' + k + '" aria-label="' + esc(s.label) + '" title="' + esc(s.label) + '"></button>'; }).join("");
  segs.addEventListener("click", function (ev) { var b = ev.target.closest(".seg"); if (b) go(+b.dataset.k); });
  if (SC.length < 2) segs.hidden = true;

  function go(k) {
    k = (k + SC.length) % SC.length; gen++;                   // gen++ stops any animation still running
    SC.forEach(function (s, j) {
      s.el.classList.toggle("on", j === k);
      if (j === k) s.el.removeAttribute("aria-hidden"); else s.el.setAttribute("aria-hidden", "true");
    });
    Array.prototype.forEach.call(segs.children, function (b, j) { b.setAttribute("aria-current", String(j === k)); });
    cyc.k = k; cyc.doneAt = 0; cyc.stepAt = Date.now();
    var s = SC[k]; $("sceneName").textContent = s.label;
    if (s.id === "qe") { state.i = 0; render(); }
    else play(s).then(function () { cyc.doneAt = Date.now(); s.n++; }, function () {});
  }

  var perLang = Math.max(1.5, TG.secondsPerLanguage || 3) * 1000, hold = Math.max(1, AN.holdSeconds || 4) * 1000;
  function tick() {
    var now = Date.now(), s = SC[cyc.k];
    if (!s) return;
    if (!state.auto || document.hidden) { cyc.stepAt = now; if (cyc.doneAt) cyc.doneAt = now; return; }
    if (s.id === "qe") {
      if (now - cyc.stepAt < perLang) return;
      cyc.stepAt = now;
      if (state.i + 1 < slots().length) { state.i++; render(); }
      else { state.e = (state.e + 1) % EX.length; state.i = 0; if (SC.length > 1) go(cyc.k + 1); else render(); }
    } else if (cyc.doneAt && now - cyc.doneAt >= hold) go(cyc.k + 1);
  }

  /* Draw every animation in its finished state once, so the hero takes the
     height of the tallest one and nothing below it moves while they play. */
  function lockHeight() { box.style.minHeight = ""; box.style.minHeight = box.offsetHeight + "px"; }
  Promise.all(SC.filter(function (s) { return s.fn; }).map(function (s) { return play(s, true).catch(function () {}); }))
    .then(function () {
      lockHeight(); setAutoIcon(); go(0); setInterval(tick, 200);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(lockHeight);
      var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(lockHeight, 200); });
    });
})();
</script>
</body>
